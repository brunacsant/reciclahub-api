
name: ReciclaHub CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar build e testes
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run:
          if [ -z "$SPRING_DATASOURCE_URL" ]; then
            echo "ERRO: DB_URL nao configurado"
            exit 1
          fi

          if [ -z "$SPRING_DATASOURCE_USERNAME" ]; then
            echo "ERRO: DB_USERNAME nao configurado"
            exit 1
          fi

          if [ -z "$SPRING_DATASOURCE_PASSWORD" ]; then
            echo "ERRO: DB_PASSWORD nao configurado"
            exit 1
          fi

          echo "Secrets presentes no ambiente"
          chmod +x mvnw
          ./mvnw clean verify

      - name: Publicar relatorios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Construir imagem Docker
        run: docker build -t reciclahub-api:${{ github.sha }} .

  deploy-staging:
    name: Deploy Staging
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Windows, X64]
    environment: staging

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Deploy Docker Staging
        shell: pwsh
        run: |
          docker compose -f docker-compose.environments.yml -p reciclahub-env up -d --build staging
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verificar Staging
        shell: pwsh
        run: |
          docker compose -f docker-compose.environments.yml -p reciclahub-env ps staging
          if ($LASTEXITCODE -ne 0) { exit 1 }

          curl.exe -s -o NUL -w "%{http_code}" http://localhost:8081/

  deploy-production:
    name: Deploy Producao
    needs: deploy-staging
    runs-on: [self-hosted, Windows, X64]
    environment: production

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Deploy Docker Producao
        shell: pwsh
        run: |
          docker compose -f docker-compose.environments.yml -p reciclahub-env up -d --build production
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verificar Producao
        shell: pwsh
        run: |
          docker compose -f docker-compose.environments.yml -p reciclahub-env ps production
          if ($LASTEXITCODE -ne 0) { exit 1 }

          curl.exe -s -o NUL -w "%{http_code}" http://localhost:8082/
