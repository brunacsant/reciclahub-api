
name: ReciclaHub CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Ambiente de deploy"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar build e testes
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$SPRING_DATASOURCE_URL" ] ||
             [ -z "$SPRING_DATASOURCE_USERNAME" ] ||
             [ -z "$SPRING_DATASOURCE_PASSWORD" ]; then
            echo "Credenciais do banco nao configuradas"
            exit 1
          fi

          chmod +x mvnw
          ./mvnw clean verify

      - name: Publicar relatorios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Construir imagem Docker
        run: docker build -t reciclahub-api:${{ github.sha }} .

  deploy-staging:
    name: Deploy Staging
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'staging' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Windows, X64]
    environment: staging

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ORACLE_APP_USER: ${{ secrets.ORACLE_APP_USER }}
      ORACLE_APP_PASSWORD: ${{ secrets.ORACLE_APP_PASSWORD }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar configuracao
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JWT_SECRET)) {
            throw "JWT_SECRET nao configurado"
          }

          docker info
          if ($LASTEXITCODE -ne 0) { exit 1 }

          docker network inspect reciclahub-api_reciclahub-net *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Rede Docker nao encontrada"
          }

      - name: Deploy Docker Staging
        shell: powershell
        run: |
          docker compose -f docker-compose.environments.yml -p reciclahub-env up -d --build staging
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verificar Staging
        shell: powershell
        run: |
          docker compose -f docker-compose.environments.yml -p reciclahub-env ps staging
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $sucesso = $false

          for ($i = 1; $i -le 24; $i++) {
            $codigo = curl.exe -s -o NUL -w "%{http_code}" --max-time 3 http://localhost:8081/

            if ($LASTEXITCODE -eq 0 -and $codigo -match '^\d{3}$') {
              $status = [int]$codigo
              Write-Host "Staging respondeu HTTP $status"

              if ($status -ge 200 -and $status -lt 500) {
                $sucesso = $true
                break
              }
            }

            Write-Host "Aguardando inicializacao do staging... tentativa $i/24"
            Start-Sleep -Seconds 5
          }

          if (-not $sucesso) {
            docker logs reciclahub-staging --tail 80
            throw "Staging nao respondeu corretamente"
          }

  deploy-production:
    name: Deploy Producao
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'production' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Windows, X64]
    environment: production

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ORACLE_APP_USER: ${{ secrets.ORACLE_APP_USER }}
      ORACLE_APP_PASSWORD: ${{ secrets.ORACLE_APP_PASSWORD }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar configuracao
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JWT_SECRET)) {
            throw "JWT_SECRET nao configurado"
          }

          docker info
          if ($LASTEXITCODE -ne 0) { exit 1 }

          docker network inspect reciclahub-api_reciclahub-net *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Rede Docker nao encontrada"
          }

      - name: Deploy Docker Producao
        shell: powershell
        run: |
          docker compose -f docker-compose.environments.yml -p reciclahub-env up -d --build production
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verificar Producao
        shell: powershell
        run: |
          docker compose -f docker-compose.environments.yml -p reciclahub-env ps production
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $sucesso = $false

          for ($i = 1; $i -le 24; $i++) {
            $codigo = curl.exe -s -o NUL -w "%{http_code}" --max-time 3 http://localhost:8082/

            if ($LASTEXITCODE -eq 0 -and $codigo -match '^\d{3}$') {
              $status = [int]$codigo
              Write-Host "Producao respondeu HTTP $status"

              if ($status -ge 200 -and $status -lt 500) {
                $sucesso = $true
                break
              }
            }

            Write-Host "Aguardando inicializacao da producao... tentativa $i/24"
            Start-Sleep -Seconds 5
          }

          if (-not $sucesso) {
            docker logs reciclahub-production --tail 80
            throw "Producao nao respondeu corretamente"
          }
