
services:
  staging:
    build:
      context: .
      dockerfile: Dockerfile
    image: reciclahub-api:latest
    container_name: reciclahub-staging
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: ${ORACLE_APP_USER:-reciclahub}
      SPRING_DATASOURCE_PASSWORD: ${ORACLE_APP_PASSWORD:-reciclahub}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_ISSUER: reciclahub-api
      SERVER_PORT: "8080"
    ports:
      - "8081:8080"
    networks:
      - reciclahub-net

  production:
    build:
      context: .
      dockerfile: Dockerfile
    image: reciclahub-api:latest
    container_name: reciclahub-production
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: ${ORACLE_APP_USER:-reciclahub}
      SPRING_DATASOURCE_PASSWORD: ${ORACLE_APP_PASSWORD:-reciclahub}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_ISSUER: reciclahub-api
      SERVER_PORT: "8080"
    ports:
      - "8082:8080"
    networks:
      - reciclahub-net

networks:
  reciclahub-net:
    external: true
    name: reciclahub-api_reciclahub-net
